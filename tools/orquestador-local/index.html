<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orquestador local</title>
<style>
:root{--bg:#0a0e14;--card:#10161f;--line:#1d2836;--tx:#dbe5ef;--mut:#7d8a9a;--ok:#3fb950;--warn:#e3a008;--bad:#f85149;--acc:#58a6ff;--or:#ff9f43;--cy:#4cc9f0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace}
header{padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;border-bottom:1px solid var(--line)}
h1{font-size:14px;letter-spacing:.14em;margin:0;color:var(--cy)}h1 small{color:var(--mut);letter-spacing:0;font-weight:400;margin-left:8px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
.pill{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:11.5px;color:var(--mut)}.pill b{color:var(--tx)}
.pill.ok b{color:var(--ok)}.pill.warn b{color:var(--warn)}.pill.bad b{color:var(--bad)}
.sp{flex:1}
main{padding:12px 16px 40px;display:grid;gap:12px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kpi{padding:8px 12px}.kpi b{display:block;font-size:24px}.kpi span{color:var(--mut);font-size:11px}
.grid2{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(280px,1fr);gap:12px}.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
@media (max-width:1000px){.grid2{grid-template-columns:1fr}}
svg text{font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;font-size:11px;color:var(--mut)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
table{border-collapse:collapse;width:100%;min-width:520px}th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:11px}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.mut{color:var(--mut)}.or{color:var(--or)}
.alert{border-left:3px solid var(--bad);padding:5px 9px;margin:4px 0;background:rgba(248,81,73,.08);border-radius:4px}
.alert.w{border-color:var(--warn);background:rgba(227,160,8,.08)}.alert.i{border-color:var(--acc);background:rgba(88,166,255,.08)}
button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:5px 11px;cursor:pointer;font:inherit}button.ghost{background:transparent;color:var(--acc);border:1px solid var(--line)}
pre{margin:6px 0 0;white-space:pre-wrap;word-break:break-all;background:rgba(127,127,127,.12);padding:8px;border-radius:6px}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
.bus{max-height:300px;overflow-y:auto;font-size:12px;line-height:1.7}.bus div{border-bottom:1px solid rgba(127,127,127,.1)}
.tag{display:inline-block;min-width:62px;color:var(--mut)}
#detail{min-height:92px}
.bars{display:flex;align-items:flex-end;gap:3px;height:48px}.bars i{flex:1;background:var(--acc);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
.card2{position:absolute;border:1.5px solid #4cc9f0;border-radius:8px;background:#0f1722;padding:6px 9px;font-size:11.5px;line-height:1.3;cursor:grab;user-select:none;touch-action:none;overflow:hidden}.card2:hover{background:#142033}.card2 .ttl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:2px 0 3px;color:#c7d3e0}.bar{height:3px;background:#1d2836;border-radius:2px;margin:2px 0 3px}.bar i{display:block;height:3px;border-radius:2px}
@media (prefers-reduced-motion:reduce){animateMotion{display:none}}
.card button:not(.ghost){padding:3px 9px}
.banner{position:sticky;top:0;z-index:40;background:#3b1215;border-bottom:2px solid #f85149;color:#ffd7d4;padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}.banner b{color:#fff}.banner button{background:#f85149}

/* ===== diseño pro ===== */
:root{--g1:#1f6feb;--g2:#8957e5;--glass:rgba(16,22,31,.72)}
body{font:13.5px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(1200px 500px at 15% -10%,rgba(31,111,235,.18),transparent 60%),radial-gradient(900px 420px at 95% 0%,rgba(137,87,229,.16),transparent 60%),var(--bg);background-attachment:fixed}
h1{font-size:15px;letter-spacing:.18em;background:linear-gradient(90deg,#4cc9f0,#8957e5);-webkit-background-clip:text;background-clip:text;color:transparent}
header{background:var(--glass);backdrop-filter:blur(10px);position:sticky;top:0;z-index:20;border-bottom:1px solid rgba(88,166,255,.18)}
.card{background:linear-gradient(180deg,rgba(20,28,40,.92),rgba(14,20,29,.92));border:1px solid rgba(88,166,255,.12);box-shadow:0 8px 30px rgba(0,0,0,.28);border-radius:14px}
h2{font-size:11.5px;color:#9db1c9}
.sec{display:flex;align-items:center;gap:10px;margin:14px 2px 2px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#cfe3ff;font-weight:700}
.sec:before{content:"";width:4px;height:16px;border-radius:2px;background:linear-gradient(180deg,#4cc9f0,#8957e5)}
.sec small{letter-spacing:0;text-transform:none;color:var(--mut);font-weight:400}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{position:relative;overflow:hidden;border-radius:14px;padding:12px 14px;border:1px solid rgba(255,255,255,.07);background:linear-gradient(145deg,rgba(24,34,48,.95),rgba(13,19,28,.95))}
.tile:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--c,#4cc9f0)}
.tile b{display:block;font-size:30px;line-height:1.05;font-weight:800;color:var(--c,#dbe5ef);text-shadow:0 0 22px var(--c,transparent)}
.tile span{display:block;margin-top:3px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.tile i{position:absolute;right:10px;top:8px;font-style:normal;font-size:20px;opacity:.55}
.chats{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.chat{position:relative;border-radius:12px;padding:11px 13px;background:rgba(10,16,24,.85);border:1px solid var(--c,#1d2836)}
.chat .top{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mut)}
.chat .led{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.chat.work .led{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
.chat .iss{margin:7px 0 3px;font-size:15px;font-weight:700}
.chat .st{font-size:11.5px;color:var(--c)}
.chat .ft{margin-top:6px;font-size:11px;color:var(--mut);display:flex;justify-content:space-between}
.chip{display:inline-block;border-radius:999px;padding:1px 8px;font-size:10.5px;border:1px solid var(--c,#1d2836);color:var(--c,#9db1c9)}
details.fold{border:1px solid rgba(88,166,255,.12);border-radius:14px;background:rgba(14,20,29,.6)}
details.fold>summary{cursor:pointer;list-style:none;padding:11px 14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#9db1c9;display:flex;gap:8px;align-items:center}
details.fold>summary:before{content:"▸";color:var(--cy);transition:transform .15s}details.fold[open]>summary:before{transform:rotate(90deg)}
details.fold>summary small{letter-spacing:0;text-transform:none;color:var(--mut)}
details.fold>.in{padding:0 12px 12px;display:grid;gap:12px}
button{background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 4px 14px rgba(31,111,235,.28)}

.banner{position:static!important;margin:10px auto 0;max-width:1468px;width:calc(100% - 32px);background:linear-gradient(90deg,rgba(255,159,67,.10),rgba(255,159,67,.03));border:1px solid rgba(255,159,67,.28)!important;border-radius:12px;color:#e8c9a6;padding:7px 12px;font-size:12.5px;gap:6px 12px}
.banner b{color:#ffd9b0;font-weight:600}.banner .dot{width:7px;height:7px;border-radius:50%;background:#ff9f43;box-shadow:0 0 10px #ff9f43;flex:none}
.banner .chip{border-color:rgba(255,159,67,.35);color:#e8c9a6;--c:rgba(255,159,67,.35)}.banner .why{color:#9a8a76;font-size:11.5px;flex:1;min-width:220px}
.banner button{background:transparent;color:#ffd9b0;border:1px solid rgba(255,159,67,.4);box-shadow:none;padding:3px 10px;font-size:12px}.banner button:hover{background:rgba(255,159,67,.14)}
</style>
</head>
<body>
<header>
  <h1>ORQUESTADOR<small>fábrica viva · solo lectura · datos reales de GitHub</small></h1>
  <span class="sp"></span>
  <span class="pill" id="p-kill"></span><span class="pill" id="p-owner"></span><span class="pill" id="p-condor"></span><span class="pill" id="p-rate"></span>
  <span class="mut" id="age"></span><button class="ghost" id="reload">Actualizar</button>
</header>
<div id="tip" style="display:none;position:fixed;z-index:50;max-width:340px;background:#0f1722;border:1px solid #2b3b52;border-radius:8px;padding:9px 11px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none"></div>
<div id="toast" style="display:none;position:fixed;right:16px;bottom:16px;z-index:60;max-width:420px;background:#0f1722;border:1px solid #3fb950;border-radius:8px;padding:10px 12px;font-size:12.5px"></div>
<div id="banner" style="display:none"></div>
<main id="app"><div class="card mut">Cargando datos de GitHub…</div></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const coT=iso=>{try{return new Intl.DateTimeFormat('es-CO',{timeZone:'America/Bogota',hour:'numeric',minute:'2-digit',hour12:true}).format(new Date(iso))}catch(e){return (iso||'').slice(11,16)}};
const coD=iso=>{try{return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Bogota',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(iso))}catch(e){return (iso||'').slice(0,10)}};
const COL={Factory:"#4cc9f0",Condor:"#f72585",GrindFlow:"#7bd88f",brvtal:"#ff9f43",ControlBot:"#b794f6",AutoFactory:"#ffd166",FactoryRunner:"#9aa5b1"};
const OWNER="pl0n3r";
let last=null,sel=null;
let loadRetry=null;
async function load(force){
  $('#reload').disabled=true;
  clearTimeout(loadRetry);
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),90000);
  let ok=false;
  try{const r=await fetch('/api/data'+(force?'?refresh=1':''),{signal:ctl.signal});const j=await r.json();
    if(j.data){const e=j.extra||{};const sig=JSON.stringify([j.data.generated_at,e.release_flow,e.decided,e.planner_on,e.refreshing,(e.agents||[]).map(a=>(a.chats||[]).map(c=>c.chat_id+c.state)),(e.assigned||[]).map(x=>x.issue+x.chat),(e.commands||[]).length]);
      const changed=sig!==window._sig;window._sig=sig;last=j;ok=true;
      if(!dragging&&(changed||force)&&!document.hidden)render();
      if(e.refreshing||(force&&changed)){clearTimeout(window._rf);window._rf=setTimeout(()=>load(false),15000)}}else if(!last){$('#app').innerHTML='<div class="card bad">'+esc(j.error||'Sin datos')+' · reintentando solo…</div>'}
  }catch(e){if(!last)$('#app').innerHTML='<div class="card bad">No se pudo leer el servidor local ('+esc(e&&e.name==='AbortError'?'tardó demasiado':e)+') · reintentando solo…</div>'}
  clearTimeout(to);
  $('#reload').disabled=false;
  // Sin datos todavía (servidor recién arrancado o GitHub sin cuota): reintenta cada 8 s hasta tenerlos.
  if(!ok&&!last)loadRetry=setTimeout(()=>load(false),8000);
}
function hrs(h){return h==null?'—':h<1?(Math.max(1,Math.round(h*60))+' min'):h<48?Math.round(h)+' h':Math.round(h/24)+' d'}
function ageText(){if(!last)return;const s=Math.round(Date.now()/1000-last.cached_at);$('#age').textContent='leído hace '+(s<90?s+' s':Math.round(s/60)+' min')+(last.error?' · '+last.error:'')}

function roadTo0(d){
  const rows=d.repos.filter(r=>r.total>0).sort((a,b)=>b.total-a.total);
  const max=Math.max(1,...rows.map(r=>r.total));
  const COLS2={disponible:'#3fb950',reservado:'#4cc9f0','en revisión':'#8957e5','requiere recuperación':'#ff9f43',bloqueado:'#f85149','del dueño (live/decisión)':'#d29922',planificado:'#7d8a9a'};
  const bars=rows.map(r=>{
    const segs=Object.entries(r.counts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<i title="${esc(k)}: ${v}" style="width:${v/max*100}%;background:${COLS2[k]||'#58a6ff'}"></i>`).join('');
    return `<div style="display:grid;grid-template-columns:110px 1fr 34px;gap:10px;align-items:center;margin:5px 0"><b style="color:${COL[r.repo]||'inherit'}">${esc(r.repo)}</b><div style="display:flex;height:10px;border-radius:6px;overflow:hidden;background:#0c121a">${segs}</div><span class="n" style="text-align:right">${r.total}</span></div>`;
  }).join('');
  const legend=Object.entries(COLS2).map(([k,c])=>`<span><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${c};margin-right:5px"></i>${esc(k)}</span>`).join('');
  return `<div class="card"><h2>Camino a 0 issues · por repo y estado</h2>${bars}<div class="legend" style="margin-top:8px">${legend}</div></div>`;
}
function ownerCard(ex,d){
  const it=ex.owner_tasks||[];
  if(!it.length)return '';
  const pend=it.filter(x=>!x.hecho),done=it.filter(x=>x.hecho);
  const row=x=>`<details style="margin:7px 0;border:1px solid rgba(255,159,67,.25);border-radius:10px;padding:8px 11px;background:rgba(255,159,67,.05)"><summary style="cursor:pointer"><b style="color:#ffd9b0">${esc(x.titulo)}</b> <span class="mut">· destraba ~${x.destraba} · ${esc(x.estado)}</span></summary><div style="margin-top:6px"><div>${esc(x.como)}</div>${(()=>{const g=x.decision&&d?gateOf(d,x.decision.repo,x.decision.n):null;return g?decisionBlock(x.decision.repo,g):''})()}<div class="mut" style="margin-top:4px">Issues: ${x.issues.map(esc).join(', ')}</div></div></details>`;
  const ok=d=>`<div class="mut" style="margin:3px 0">✓ ${esc(d.titulo)} · ${esc(d.estado)}</div>`;
  return `<div class="sec">Decisiones y acciones tuyas <small>${pend.length} ${pend.length===1?'pendiente':'pendientes'} · se comprueban solas</small></div><div class="card">${pend.length?pend.map(row).join(''):'<div class="alert i" style="border-color:var(--ok);background:rgba(63,185,80,.08)"><b>Nada pendiente tuyo</b></div>'}${done.length?`<details class="fold" style="margin-top:8px"><summary>Ya resueltas (${done.length})</summary><div class="in">${done.map(ok).join('')}</div></details>`:''}</div>`;
}
function heroKpis(d,ex){
  const t=d.totals,ag=(ex.agents||[]).filter(a=>a.age_s<300);
  let w=0,f=0,e=0,n=0;ag.forEach(a=>(a.chats||[]).forEach(c=>{if(!c.directed)return;n++;if(c.state==='generando')w++;else if(c.state==='esperando_envio')f++;else if(c.state==='error'||c.state==='desconocido')e++}));
  const own=pendAlerts(d,ex).length+(ex.owner_tasks||[]).filter(x=>!x.hecho).length;
  const T=(v,l,c,i)=>`<div class="tile" style="--c:${c}"><i>${i}</i><b>${v}</b><span>${l}</span></div>`;
  const open=d.repos.reduce((a,r)=>a+r.total,0);
  return '<div class="hero">'+T(open,'issues abiertos · meta 0',open?'#e3a008':'#3fb950','🎯')+T(w,'chats trabajando','#4cc9f0','⚙')+T(f,'chats libres',f?'#3fb950':'#7d8a9a','✓')+T(e,'chats a reemplazar',e?'#f85149':'#7d8a9a','⚠')
    +T((d.ready||[]).length,'PRs listos para fusionar',(d.ready||[]).length?'#3fb950':'#7d8a9a','⇄')+T(t.recover,'frentes sin recuperar (límite '+RECOVER_LIMIT+')',t.recover>RECOVER_LIMIT?'#ff9f43':'#7d8a9a','↺')
    +T(t.merged24,'fusionados en 24 h','#8957e5','★')+T(own,'decisiones tuyas',own?'#f85149':'#3fb950','☝')+'</div>';
}
async function relAct(action,extra,msg){
  if(!TOKEN){toast('Sin token: recarga la página',true);return}
  if(msg&&!confirm(msg))return;
  try{const r=await fetch('/api/release',{method:'POST',headers:{'Content-Type':'application/json','X-Orq-Token':TOKEN},body:JSON.stringify(Object.assign({action},extra||{}))});const j=await r.json();if(!j.ok)alert(j.error||'No se pudo');else load(true)}catch(e){alert('No se pudo completar la acción')}
}
function releaseCard(ex,d){
  const rl=(d&&d.release)||{};const upToDate=rl.main_version&&('v'+rl.main_version)===rl.last_release;
  const r=ex.release_flow||{state:'idle'};const st=r.state||'idle';
  const btn=(t,c,f)=>`<button onclick="${f}" style="cursor:pointer;padding:5px 14px;border-radius:6px;border:1px solid ${c};background:transparent;color:${c};font-weight:600;margin:4px 6px 0 0">${t}</button>`;
  let body='';
  if(st==='idle'||st==='done'||st==='error'){
    if(st==='done')body+=`<div class="ok"><b>Paso 5 de 5 · completado</b><br>✓ ${esc(r.mensaje||'Release terminado')} (versión ${esc(r.version)})</div>`;
    if(st==='error')body+=`<div class="bad">✗ ${esc(r.mensaje||'Falló el release')}</div>`;
    body+=`<div class="mut">Prepara una versión nueva de Factory. Yo hago todo: pauso las fusiones, espero que pase todo, abro la puerta y publico. Tú solo contestas dos preguntas.</div>`+(upToDate?`<div class="ok" style="margin-top:6px">Al día: main tiene la versión ${esc(rl.main_version)} y ya está publicada. No hay nada que preparar hasta que se suba la versión en main.</div>`:btn('▶ Preparar release','#3fb950',"relAct('start',{})"));
  }else{
    const txt={ci:'Esperando que todas las pruebas de main pasen en verde…',gate:'Abriendo la puerta de release…',decision:'Todo listo. Necesito tu decisión:',release:'Publicando el release… (unos minutos)',mover_v1:'Casi listo. Falta un paso que solo tú puedes dar:',selftest:'Comprobando que el canal v1 quedó bien…'}[st]||st;
    const STEPS=[['Pruebas y puerta','Espero que todo esté en verde y abro la puerta','auto'],['Tu decisión','Confirmas si publicamos','tú'],['Publicando','Corre el release de Factory','auto'],['Mover v1','Apuntas la etiqueta v1 al commit nuevo','tú'],['Verificación','Compruebo que el canal v1 quedó bien','auto']];
    const idx={ci:1,gate:1,decision:2,release:3,mover_v1:4,selftest:5}[st]||1;
    body+=`<div style="margin:2px 0 10px"><b>Versión ${esc(r.version)} · paso ${idx} de 5</b><ol style="list-style:none;margin:8px 0 0;padding:0">`+STEPS.map(([t,dsc,who],n)=>{const s=n+1<idx?'done':n+1===idx?'now':'next';const ic=s==='done'?'✓':s==='now'?'●':'○';const col=s==='done'?'#3fb950':s==='now'?'#4cc9f0':'#6b7a90';
      return `<li style="display:flex;gap:10px;padding:5px 0;color:${s==='next'?'#8b949e':'inherit'}"><span style="color:${col};font-weight:700;width:16px">${ic}</span><span><b>${n+1}. ${esc(t)}</b> <span class="mut">· ${who==='tú'?'lo haces tú':'lo hago yo'}</span><br><span class="mut">${esc(dsc)}</span>${s==='now'?`<br><span style="color:#4cc9f0">${esc(txt)}</span>`:''}</span></li>`}).join('')+`</ol></div>`;
    if(st==='ci'&&(r.missing||[]).length)body+=`<div class="mut">Faltan: ${(r.missing||[]).map(esc).join(', ')}</div>`;
    if(st==='decision'){
      body+=`<div class="mut" style="margin:4px 0">¿Publicamos la versión ${esc(r.version)} de Factory ahora? Es lo que usan todos los proyectos. <a target="_blank" href="https://github.com/${OWNER}/Factory/issues/${r.gate}">ver puerta #${r.gate} ↗</a></div>`;
      body+=r.decision?`<div class="mut">Enviaste ${esc(r.decision)}; esperando que se cierre la puerta…</div>`:btn('A · Sí, publicar','#3fb950',"relAct('decide',{option:'A'},'¿Publicar Factory "+esc(r.version||'')+" ahora?')")+btn('B · No, esperar','#e3a008',"relAct('decide',{option:'B'})");
    }
    if(st==='mover_v1')body+=`<div class="mut" style="margin:4px 0">Hay que apuntar la etiqueta <code>v1</code> a la versión nueva (${esc((r.sha||'').slice(0,8))}). Es lo que hace que los demás proyectos reciban el cambio.</div>`+btn('Mover v1 ahora','#f85149',"relAct('move_v1',{},'¿Mover v1 al commit "+esc((r.sha||'').slice(0,8))+"? Todos los proyectos recibirán esta versión.')");
    body+=btn('Cancelar','#8b949e',"relAct('cancel',{},'¿Cancelar el release y reanudar las fusiones?')");
  }
  return `<div class="card"><h2>Release de Factory</h2>${body}</div>`;
}
function chatCards(ex){

  if(rel.main_version&&rel.last_release&&('v'+rel.main_version)!==rel.last_release)items.push(['bad','Release preparada sin publicar',`main tiene la versión ${rel.main_version} y la última release es ${rel.last_release}: abre la puerta de release (release-window).`]);
  else if(rel.ahead>=15)items.push(['w','Muchos cambios sin publicar en v1',`main lleva ${rel.ahead} commits por delante de v1; conviene preparar la siguiente release.`]);
  (ex.owner_blockers||[]).slice(-6).forEach(b=>items.push(['w','Bloqueado, ningún chat puede avanzarlo: '+b.issue,'frenado por '+((b.blockers||[]).join(', ')||'causa no identificada')+' · '+b.why]));
  if(ex.kill&&ex.kill!=='RUNNING')items.push(['bad','Kill switch en '+ex.kill,'Los agentes no avanzan hasta que vuelva a RUNNING (Factory #767).']);
  (d.health||[]).filter(x=>!x.ok).forEach(x=>items.push(['bad','Sitio caído: '+x.nombre,(x.code?('HTTP '+x.code):x.error||'sin respuesta')]));
  if(d.rate.remaining<800)items.push(['w','Cupo de la API de GitHub bajo',d.rate.remaining+'/'+d.rate.limit+': evita consultas amplias.']);
  const done=items.filter(i=>i[0]==='ok'),todo=items.filter(i=>i[0]!=='ok');
  const body=todo.length?todo.map(([c,t,m,trustedHtml])=>`<div class="alert ${c==='bad'?'':'w'}"><b>${esc(t)}</b> · ${trustedHtml?m:esc(m)}</div>`).join(''):'<div class="alert i" style="border-color:var(--ok);background:rgba(63,185,80,.08)"><b>Nada requiere tu atención ahora.</b> Los agentes avanzan solos.</div>';
  const doneH=done.length?`<details class="fold" style="margin-top:10px"><summary>Decisiones ya tomadas (${done.length}) <small>GitHub las está procesando</small></summary><div class="in">${done.map(([c,t,m])=>m).join('')}</div></details>`:'';
  return `<div class="card"><h2>Necesita tu atención (${todo.length})</h2>${body}${doneH}</div>`;
}
function goalsRows(g){
  return g.map(x=>{const p=x.total?Math.round(x.done/x.total*100):0;const c=p>=100?'#3fb950':p>=40?'#4cc9f0':'#e3a008';
    return `<details style="margin:6px 0"><summary style="cursor:pointer"><b style="color:${COL[x.repo]||'inherit'}">${esc(x.repo)}</b> ${esc(x.nombre)} <span class="mut">· ${x.done}/${x.total} · ${p}%</span><div class="bar" style="height:6px;margin-top:4px"><i style="width:${p}%;background:${c};height:6px"></i></div></summary>${x.pend.length?'<ul style="margin:6px 0 0 18px;padding:0">'+x.pend.map(i=>`<li><a target="_blank" href="https://github.com/${OWNER}/${x.repo}/issues/${i.n}">#${i.n}</a> ${esc(i.title)}</li>`).join('')+'</ul>':'<div class="ok">Meta completa</div>'}${x.unknown?`<div class="mut">${x.unknown} issue(s) de la meta no se encontraron (revisa config.json)</div>`:''}</details>`}).join('');
}
function goalsCard(d){
  const all=(d.goals||[]).slice().sort((x,y)=>(y.total-y.done)-(x.total-x.done));
  const top=all.slice(0,6),rest=all.slice(6);
  return `<div class="card"><h2>Metas · lo que más falta (${all.length} en total)</h2>`+goalsRows(top)+(rest.length?`<details class="fold" style="margin-top:8px"><summary>Ver las otras ${rest.length} metas</summary><div class="in">${goalsRows(rest)}</div></details>`:'')+`<div class="mut" style="margin-top:6px">Calculadas con las épicas de cada repo; sin listas fijas.</div></div>`;
}
function prodCard(d){
  const rel=d.release||{};
  return `<div class="card"><h2>Producción y release</h2><div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px">`+(d.health||[]).map(h=>`<div style="border:1px solid ${h.ok?'#2f6f3d':'#f85149'};border-radius:8px;padding:6px 10px"><b>${esc(h.nombre)}</b> <span class="${h.ok?'ok':'bad'}">● ${h.ok?'arriba':'caído'}</span><div class="mut">HTTP ${h.code??'—'} · ${h.ms} ms</div></div>`).join('')+`</div>`+
  (rel.error?`<div class="mut">Release: ${esc(rel.error)}</div>`:`<div>Factory: main v${esc(rel.main_version)} · última release <b>${esc(rel.last_release)}</b> · v1 va ${rel.ahead} commit${rel.ahead===1?'':'s'} por detrás de main</div>`)+`</div>`;
}

async function releaseAllDialog(){
  if(!TOKEN){toast('Sin token: recarga la página',true);return}
  toast('Calculando qué se perdería…');
  let items;try{const r=await fetch('/api/release-preview');const j=await r.json();if(!j.items)throw new Error(j.error||'sin datos');items=j.items}catch(e){toast('✕ '+e,true);return}
  const safe=items.filter(i=>!i.at_risk),risk=items.filter(i=>i.at_risk);
  const row=i=>`<li>${esc(i.repo)}#${i.n} <span class="mut">${esc(i.title)}${i.pr?' · PR #'+i.pr:''}${i.ahead?' · '+i.ahead+' commit(s) en '+esc(i.branch):''}</span></li>`;
  const m=document.createElement('div');m.id='relmodal';m.style.cssText='position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:16px';
  m.innerHTML=`<div class="card" style="max-width:760px;max-height:88vh;overflow:auto;background:#10161f"><h2>Liberar frentes sin recuperar (${items.length})</h2>
   <div class="alert w"><b>Cómo funciona:</b> solo libera los frentes que no tienen PR abierto ni commits propios, con el comando oficial <code>/liberar-forzado</code>. Esos no tienen nada que perder.</div>
   <h2 style="margin-top:10px">Seguros (${safe.length}): sin PR abierto ni commits propios</h2><ul style="margin:0 0 8px 18px;padding:0">${safe.map(row).join('')||'<li class="mut">ninguno</li>'}</ul>
   <h2>Con trabajo (${risk.length}): NO se liberan desde aquí</h2><ul style="margin:0 0 8px 18px;padding:0;color:#ffb4ae">${risk.map(row).join('')||'<li class="mut">ninguno</li>'}</ul>
   <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center"><button id="rel-safe" ${safe.length?'':'disabled'}>Liberar solo los seguros (${safe.length})</button>
<button class="ghost" id="rel-cancel">Cancelar</button></div>
   <div class="mut" style="margin-top:8px">Los frentes con PR abierto o commits propios se liberarán automáticamente, conservando su rama y su PR, cuando entre Factory #1175 (con #1190 y #1191). Mientras tanto no se liberan a la fuerza para no perder trabajo.</div></div>`;
  document.body.appendChild(m);
  const run=async list=>{let ok=0,bad=[];for(const i of list){try{const r=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json','X-Orq-Token':TOKEN},body:JSON.stringify({action:'release_forced',repo:i.repo,number:i.n})});const j=await r.json();if(j.ok)ok++;else bad.push(i.repo+'#'+i.n)}catch(e){bad.push(i.repo+'#'+i.n)}}
    m.remove();toast('Liberación solicitada para '+ok+(bad.length?' · fallaron '+bad.join(', '):'')+'. Coordinación la procesa en unos minutos.',bad.length>0);load(true)};
  $('#rel-cancel').onclick=()=>m.remove();
  $('#rel-safe').onclick=()=>run(safe);
}

function render(){
  const j=last,d=j.data,ex=j.extra||{},t=d.totals;window.LASTEX=ex;
  const kp=(v,l,c)=>`<div class="card kpi"><b class="${c||''}">${v}</b><span>${l}</span></div>`;
  $('#p-kill').className='pill '+(ex.kill==='RUNNING'?'ok':'bad');$('#p-kill').innerHTML='kill switch <b>'+esc(ex.kill||'?')+'</b>';
  const own=pendAlerts(d,ex).length;$('#p-owner').className='pill '+(own?'bad':'ok');$('#p-owner').innerHTML='decisiones tuyas <b>'+own+'</b>';
  const c=ex.condor;$('#p-condor').innerHTML='Condor <b>'+(c&&c.version?('v'+esc(c.version)):'?')+'</b>';
  $('#p-rate').className='pill '+(d.rate.remaining<800?'warn':'');$('#p-rate').innerHTML='API <b>'+d.rate.remaining+'/'+d.rate.limit+'</b>';
  const P={};let h='',curp='resumen';const pg=n=>{P[curp]=(P[curp]||'')+h;h='';curp=n};
  const freeN=(ex.agents||[]).filter(a=>a.age_s<300).reduce((t,a)=>t+(a.chats||[]).filter(c=>c.directed&&c.state==='esperando_envio').length,0);
  const rf=ex.release_flow||{state:'idle'},pon=ex.planner_on!==false;
  const qt=(pgn,ico,n,l,cls)=>`<a href="#${pgn}" class="card kpi qt" style="cursor:pointer;text-decoration:none;color:inherit"><b class="${cls||''}">${ico} ${n}</b><span>${l}</span></a>`;
  const qa=(t,c,f)=>`<button onclick="${f}" style="cursor:pointer;padding:6px 14px;border-radius:6px;border:1px solid ${c};background:transparent;color:${c};font-weight:600;margin:4px 8px 0 0">${t}</button>`;
  h+=heroKpis(d,ex);
  h+='<div class="sec">Accesos rápidos</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px">'+
    qt('decisiones','⚑',own,'decisiones y avisos tuyos',own?'bad':'ok')+
    qt('release','⬆',rf.state==='idle'?'—':rf.state,'release de Factory',rf.state==='decision'||rf.state==='mover_v1'?'bad':'')+
    qt('agentes','💬',freeN,'chats libres',freeN?'warn':'ok')+
    qt('live','🚀',(()=>{let D=0,T=0;(d.goals||[]).forEach(g=>{D+=g.done;T+=g.total});return T?Math.round(D/T*100)+'%':'—'})(),'camino al live')+
    qt('avance','✓',d.ready.length,'PRs listos para fusionar')+
    qt('frentes','◎',fronts(d).length,'frentes en el mapa')+'</div>';
  h+='<div class="card"><h2>Acciones rápidas</h2>'+
    ((d.release&&d.release.main_version&&('v'+d.release.main_version)===d.release.last_release)?'':qa('▶ Preparar release de Factory','#3fb950',"location.hash='release';relAct('start',{})"))+
    qa(pon?'■ Detener reparto':'▶ Iniciar reparto',pon?'#f85149':'#3fb950',`setPlanner(${pon?'false':'true'})`)+
    qa('Ver decisiones','#4cc9f0',"location.hash='decisiones'")+
    qa('Actualizar ahora','#8b949e',"load(true)")+'</div>';
  {let w=0,f=0,e=0,o=0;(ex.agents||[]).filter(a=>a.age_s<300).forEach(a=>(a.chats||[]).forEach(c=>{if(!c.directed)return;if(c.state==='generando')w++;else if(c.state==='esperando_envio')f++;else if(c.state==='error')e++;else o++}));
   h+=`<div class="card"><h2>Chats ahora</h2><div style="display:flex;flex-wrap:wrap;gap:18px"><span class="ok">● trabajando <b>${w}</b></span><span class="warn">● libres <b>${f}</b></span><span class="bad">● en error <b>${e}</b></span><span class="mut">● otros <b>${o}</b></span><span class="mut">reparto ${pon?'activo':'detenido'}</span></div><a href="#agentes">ver detalle por chat →</a></div>`}
  h+=roadTo0(d);
  pg('decisiones');
  h+=ownerCard(ex,d);
  h+=attentionCard(d,ex);
  pg('frentes');
  h+='<div class="sec">Mapa de frentes <small>'+fronts(d).length+' frentes · cada uno con su chat</small></div>';
  h+='<div class="card">'+graph(d,ex)+legend()+'</div>';
  h+='<div class="card"><h2>Detalle del frente</h2><div id="detail">'+detail()+'</div></div>';
  pg('agentes');
  h+='<div class="sec">Agentes en vivo <small>'+chatsSummary(ex)+'</small></div>';
  h+=chatCards(ex);
  pg('release');
  h+=releaseCard(ex,d);
  h+=prodCard(d);
  pg('avance');
  if(d.ready.length){const cmd=d.ready.map(p=>`gh pr merge ${p.n} -R ${OWNER}/${p.repo} --squash`).join('\n');
    h+='<div class="sec">Listo para fusionar</div><div class="card"><h2>Un clic en el panel, o copia los comandos</h2><table><tr><th>Repo</th><th>PR</th><th>Título</th></tr>'+d.ready.map(p=>`<tr><td>${esc(p.repo)}</td><td><a target="_blank" href="https://github.com/${OWNER}/${p.repo}/pull/${p.n}">#${p.n}</a></td><td>${esc(p.title)}</td></tr>`).join('')+'</table><button id="copy" style="margin-top:8px">Copiar comandos</button><pre id="cmds">'+esc(cmd)+'</pre></div>'}
  h+='<div class="sec">Avance <small>metas calculadas con el trabajo pendiente real</small></div>';
  h+=goalsCard(d);
  h+=unlockCard(d);
  pg('live');
  h+=liveCard(d,ex);
  pg('detalle');
  h+='<div class="sec">Detalle <small>despliega lo que necesites</small></div>';
  h+='<details class="fold"><summary>Bloqueados y cuellos de botella</summary><div class="in">'+blockedBoard(d)+'<div class="card" style="box-shadow:none"><h2>Cuellos de botella</h2>'+bottlenecks(d)+'</div></div></details>';
  h+='<details class="fold"><summary>Hitos y ritmo de fusión</summary><div class="in">'+hitosCard(d)+'<div class="card" style="box-shadow:none"><h2>PRs fusionados por día (hora Colombia)</h2>'+daysChart(d)+'</div></div></details>';
  h+='<details class="fold"><summary>Por proyecto</summary><div class="in">'+('<div class="card"><h2>Por proyecto</h2><table><tr><th>Proyecto</th><th class="n">Disp.</th><th class="n">Reserv.</th><th class="n">Revisión</th><th class="n">Recup.</th><th class="n">Bloq.</th><th class="n">Dueño</th><th class="n">Plan.</th><th class="n">24 h</th><th class="n">4 d</th><th class="n">7 d</th><th class="n">Último merge</th><th class="n">PRs</th></tr>'+
   d.repos.map(r=>{const c=r.counts;return `<tr><td><b style="color:${COL[r.repo]||'inherit'}">${esc(r.repo)}</b></td><td class="n ${c.disponible?'ok':''}">${c.disponible||0}</td><td class="n">${c.reservado||0}</td><td class="n">${c['en revisión']||0}</td><td class="n ${c['requiere recuperación']?'warn':''}">${c['requiere recuperación']||0}</td><td class="n">${c.bloqueado||0}</td><td class="n">${c['del dueño (live/decisión)']||0}</td><td class="n">${c.planificado||0}</td><td class="n">${r.merged24}</td><td class="n">${r.merged96}</td><td class="n">${r.merged168}</td><td class="n ${r.last_merge_h>12?'bad':''}">${hrs(r.last_merge_h)}</td><td class="n">${r.prs.length}</td></tr>`}).join('')+'</table></div>')+'</div></details>';
  h+='<details class="fold"><summary>Bus de mensajes</summary><div class="in">'+('<div class="card"><h2>Bus de mensajes (comentarios y eventos reales)</h2><div class="bus">'+((ex.bus||[]).slice().reverse().map(b=>`<div><span class="tag">${esc(coT(b.t))}</span> <span class="tag">${esc(b.repo)}#${esc(b.n)}</span> <span class="tag or">${esc(b.tipo)}</span> ${esc(b.txt)}</div>`).join('')||'<div class="mut">Sin mensajes recientes</div>')+'</div></div>')+'</div></details>';
  if(Object.keys(d.errors).length)h+='<div class="card bad">Repos con error de lectura: '+esc(JSON.stringify(d.errors))+'</div>';
  P[curp]=(P[curp]||'')+h;
  const NAV=[['resumen','Resumen'],['decisiones','Decisiones'+(own?' ('+own+')':'')],['release','Release'],['live','Live'],['agentes','Agentes'],['frentes','Frentes'],['avance','Avance'],['detalle','Detalle']];
  let tab=(location.hash||'#resumen').slice(1);if(!P[tab])tab='resumen';
  const nav='<nav id="menu" style="display:flex;flex-wrap:wrap;gap:6px;margin:0 -2px 14px;position:sticky;top:0;z-index:20;background:rgba(11,15,20,.92);backdrop-filter:blur(8px);padding:10px 4px;border-bottom:1px solid rgba(88,166,255,.18)">'+NAV.map(([k,l])=>`<a href="#${k}" style="padding:6px 14px;border-radius:8px;text-decoration:none;font-weight:600;border:1px solid ${k===tab?'#4cc9f0':'#2b3b52'};color:${k===tab?'#4cc9f0':'#cfe3ff'};background:${k===tab?'rgba(76,201,240,.12)':'transparent'}">${l}</a>`).join('')+'</nav>';
  if(tab==='detalle'){
    const tmp=document.createElement('div');tmp.innerHTML=P.detalle;
    const fs=[...tmp.querySelectorAll(':scope > details.fold')];
    if(fs.length){
      let cur=0;try{cur=+localStorage.getItem('orq_dsub')||0}catch(e){}if(cur>=fs.length)cur=0;
      const subnav='<div style="display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px">'+fs.map((f,i)=>`<button onclick="try{localStorage.setItem('orq_dsub',${i})}catch(e){};render()" style="cursor:pointer;padding:6px 14px;border-radius:8px;border:1px solid ${i===cur?'#58a6ff':'rgba(88,166,255,.25)'};background:${i===cur?'rgba(88,166,255,.15)':'transparent'};color:inherit;font-weight:${i===cur?700:500}">${f.querySelector('summary').textContent}</button>`).join('')+'</div>';
      P.detalle='<div class="sec">Detalle <small>elige qué ver</small></div>'+subnav+'<div style="display:grid;gap:14px">'+fs[cur].querySelector('.in').innerHTML+'</div>';
    }
  }
  h=nav+P[tab]+'<div class="mut" style="text-align:center;margin-top:10px">Lectura y control de agentes · '+esc(d.generated_at)+' · se refresca cada 60 s</div>';
  const _open=new Set([...document.querySelectorAll('#app details[open]')].map(x=>(x.querySelector('summary')||{}).textContent));
  const _sy=window.scrollY;
  $('#app').innerHTML=h;
  document.querySelectorAll('#app details').forEach(x=>{const k=(x.querySelector('summary')||{}).textContent;if(_open.has(k))x.open=true});
  if(_sy&&Math.abs(window.scrollY-_sy)>2)window.scrollTo(0,_sy);
  document.querySelectorAll('.node').forEach(n=>n.onclick=()=>{sel={repo:n.dataset.r,n:+n.dataset.n};$('#detail').innerHTML=detail()});
  wire(d);
  recoverAlert(d);
  document.querySelectorAll('[data-ac]').forEach(b=>b.onclick=()=>agentCmd(b.dataset.ac,b.dataset.ch||null,b.dataset.w));
  const b=$('#copy');if(b)b.onclick=()=>{navigator.clipboard.writeText($('#cmds').textContent);b.textContent='Copiado'};
  ageText();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&last)render()});
window.addEventListener('hashchange',()=>{if(last){render();window.scrollTo(0,0)}});
$('#reload').onclick=()=>load(true);
load(false);setInterval(()=>load(false),60000);setInterval(ageText,5000);
</script>
