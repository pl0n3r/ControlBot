name: Aceptación ejecutable

on:
  pull_request:

permissions:
  contents: read
  issues: read
  checks: read

jobs:
  acceptance:
    # Excepciones de bootstrap: #2 instaló coordinación y #21 repara su caller.
    # Desde #3 todo PR requiere fingerprint real de /tomar.
    if: github.head_ref != 'trabajo/issue-2' && github.head_ref != 'trabajo/issue-21'
    uses: pl0n3r/factory/.github/workflows/aceptacion.yml@v1
    with:
      issue_number: 0
