name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    name: Validar readiness fail-closed
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
      DOMAIN: ${{ vars.DOMAIN }}
      PUBLIC_ENTRYPOINT: public/index.php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exigir configuración y entrypoint antes del deploy
        run: |
          set -euo pipefail
          [[ "$DEPLOY_ENABLED" == "true" ]] || { echo "::error::DEPLOY_ENABLED no está autorizado"; exit 1; }
          [[ -n "$DOMAIN" ]] || { echo "::error::DOMAIN no está configurado"; exit 1; }
          [[ -f "$PUBLIC_ENTRYPOINT" ]] || { echo "::error::Falta $PUBLIC_ENTRYPOINT"; exit 1; }

  deploy:
    name: Deploy protegido
    needs: readiness
    if: vars.DEPLOY_ENABLED == 'true'
    uses: pl0n3r/factory/.github/workflows/deploy.yml@v1
    with:
      domain: ${{ vars.DOMAIN }}
      health_path: ${{ vars.HEALTH_PATH || '/health.php' }}
      version_source: config/version.json
      version_format: json
      phase: ${{ vars.PRODUCTION_STAGE || 'construccion' }}
      migration_mode: ${{ vars.MIGRATION_MODE || 'none' }}
      live_migration_approved: ${{ vars.LIVE_MIGRATION_APPROVED == 'true' }}
      transport: ${{ vars.DEPLOY_TRANSPORT || 'none' }}
      hostinger_ssh_host: ${{ vars.HOSTINGER_SSH_HOST || '' }}
      hostinger_ssh_user: ${{ vars.HOSTINGER_SSH_USER || '' }}
      hostinger_ssh_port: ${{ vars.HOSTINGER_SSH_PORT || '' }}
      hostinger_release_root: ${{ vars.HOSTINGER_RELEASE_ROOT || '' }}
    secrets:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}

  smoke:
    name: Verificar identidad exacta después del deploy
    needs: [readiness, deploy]
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
      DOMAIN: ${{ vars.DOMAIN }}
      HEALTH_PATH: ${{ vars.HEALTH_PATH || '/health.php' }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.5'
          coverage: none
      - name: Validar puerta HTTPS de smoke
        run: |
          set -euo pipefail
          [[ "$DEPLOY_ENABLED" == "true" ]] || { echo "::error::Deploy no autorizado"; exit 1; }
          [[ "$DOMAIN" =~ ^https://[A-Za-z0-9][A-Za-z0-9.-]*(:443)?/?$ ]] || { echo "::error::Origen HTTPS no válido"; exit 1; }
          [[ "$HEALTH_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]] || { echo "::error::Health path inválido"; exit 1; }
          [[ "$HEALTH_PATH" != *..* ]] || { echo "::error::Health path inválido"; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SHA faltante"; exit 1; }
      - name: Comprobar health post-deploy sin divulgar identidad ni secretos
        run: |
          set -euo pipefail
          fixture="$(mktemp)"
          trap 'rm -f "$fixture"' EXIT
          response="$(curl --fail --silent --show-error --max-time 15 --max-redirs 0 --proto '=https' --output "$fixture" --write-out '%{http_code}' "${DOMAIN%/}${HEALTH_PATH}")"
          [[ "$response" == "200" ]] || { echo "::error::Health no respondió 200"; exit 1; }
          php scripts/deploy-smoke.php "$fixture" config/version.json "$EXPECTED_SHA"
