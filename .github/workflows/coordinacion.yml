name: Coordinación

on:
  schedule:
    # Housekeeping: /tomar recupera reservas stale bajo demanda; el barrido
    # periódico solo mantiene visible el estado de recuperación sin quemar cuota.
    - cron: '17 */6 * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  issues:
    types: [labeled, closed, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read

concurrency:
  group: coordinacion-${{ github.event.issue.number || github.event.pull_request.head.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  comentario:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      github.event.sender.login == github.event.comment.user.login &&
      (
        github.event.comment.body == '/tomar' ||
        github.event.comment.body == '/liberar-forzado' ||
        github.event.comment.body == '/adoptar-contrato-huerfana' ||
        startsWith(github.event.comment.body, '/liberar ') ||
        startsWith(github.event.comment.body, '/transferir ') ||
        startsWith(github.event.comment.body, '/migrar-contrato ')
      )
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: comment
      issue_number: ${{ github.event.issue.number }}
      actor: ${{ github.event.comment.user.login }}
      association: ${{ github.event.comment.author_association }}
      body: ${{ github.event.comment.body }}

  etiqueta:
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'estado: reservado'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: label
      issue_number: ${{ github.event.issue.number }}
      actor: ${{ github.event.sender.login }}
      label: ${{ github.event.label.name }}

  pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    # El sync de estado/reserva sí corre para drafts; no ejecuta el gate pesado.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: pr
      pr_number: ${{ github.event.pull_request.number }}
      action: ${{ (github.event.action == 'reopened' || github.event.action == 'synchronize') && (github.event.pull_request.draft && 'converted_to_draft' || 'ready_for_review') || github.event.action }}

  validar-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    # El gate completo se ejecuta al abrir un PR listo o con ready_for_review.
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: validate
      pr_number: ${{ github.event.pull_request.number }}
      # Bootstraps exactos: #21 y #78 reparan callers que impiden crear la
      # propia reserva. La excepción #78 exige rama + base SHA exactos y se
      # autodesactiva al moverse main.
      require_reservation: ${{ github.event.pull_request.base.sha != 'a3e258995145750b6fb10284320fd6130979ae93' && !(github.event.pull_request.number == 86 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'trabajo/issue-78' && github.event.pull_request.base.sha == '996802183248f84ee8f28c7cb25221247e52dd07') }}

  issue:
    if: github.event_name == 'issues' && (github.event.action == 'closed' || github.event.action == 'reopened')
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: issue
      issue_number: ${{ github.event.issue.number }}
      action: ${{ github.event.action }}

  sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    uses: pl0n3r/factory/.github/workflows/coordinacion.yml@v1
    with:
      operation: sweep
