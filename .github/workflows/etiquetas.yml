name: Etiquetas

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * *'
  issues:
    types: [opened, edited, reopened, labeled, unlabeled]
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Etiquetas
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validar contrato local de etiquetas
        run: >-
          python3 -m unittest
          tests.test_labels_workflow.LabelsWorkflowTests.test_cleanup_covers_exact_factory_legacy_aliases
          tests.test_labels_workflow.LabelsWorkflowTests.test_sync_depends_on_cleanup_and_keeps_factory_reusable

  limpiar_etiqueta_legacy:
    name: Limpiar aliases legacy huérfanos
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Eliminar aliases legacy solo si están huérfanos
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORIO: ${{ github.repository }}
        run: bash scripts/cleanup-legacy-label.sh

  sync:
    needs: limpiar_etiqueta_legacy
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.limpiar_etiqueta_legacy.result == 'success'
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: pl0n3r/factory/.github/workflows/etiquetas.yml@v1
    with:
      mode: sync
      language: es

  validar-issue:
    if: github.event_name == 'issues'
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: pl0n3r/factory/.github/workflows/etiquetas.yml@v1
    with:
      mode: validate
      language: es
      issue_number: ${{ github.event.issue.number }}

  validar-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: pl0n3r/factory/.github/workflows/etiquetas.yml@v1
    with:
      mode: validate
      language: es
      issue_number: ${{ github.event.pull_request.number }}

  sweep:
    if: github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: pl0n3r/factory/.github/workflows/etiquetas.yml@v1
    with:
      mode: sweep
      language: es
